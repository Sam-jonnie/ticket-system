services:
  postgres:
    image: postgres:16-alpine
    container_name: ticket_system_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ticket_user
      POSTGRES_PASSWORD: ticket_pass
      POSTGRES_DB: ticket_system
    ports:
      - "5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket_user -d ticket_system"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: